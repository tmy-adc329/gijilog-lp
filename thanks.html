<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>送信完了｜GijiLog（ギジログ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ブランドカラー（--brand）は index.html と揃えること
   ========================================================= */
:root {
  --brand: #3d4ed8;

  /* --brand から派生（原則さわらなくてOK） */
  --brand-deep: color-mix(in srgb, var(--brand) 70%, #0b0f2a);
  --brand-soft: color-mix(in srgb, var(--brand) 10%, #fff);
  --brand-softer: color-mix(in srgb, var(--brand) 5%, #fff);

  /* ニュートラル・装飾（index.html と同じ値） */
  --ink: #14162b;
  --ink-2: #4a4e66;
  --line: #e3e5ee;
  --paper: #ffffff;
  --night: #0f1124;
  --mist: #d9f2f7;
  --blush: #fbe3d6;

  --font-sans: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --font-latin: "Instrument Serif", Georgia, serif;

  --gutter: 20px;
  --maxw: 1120px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%;
  display: flex; flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.8;
  letter-spacing: .02em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, p { margin: 0; }
svg { display: block; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, #fff); outline-offset: 3px; }

.nw { white-space: nowrap; }
.container { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }

/* ワードマーク（テキストロゴ） */
.wordmark {
  display: inline-flex; align-items: baseline;
  font-size: 24px; line-height: 1; text-decoration: none; color: var(--ink);
  letter-spacing: 0;
}
.wordmark b { font-family: var(--font-sans); font-weight: 700; letter-spacing: -.01em; }
.wordmark i { font-family: var(--font-latin); font-style: italic; font-weight: 400; font-size: 1.18em; color: var(--brand); margin-left: 1px; }

/* ボタン */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 26px;
  border-radius: 999px; border: 1px solid transparent;
  font: inherit; font-weight: 700; font-size: 15px; letter-spacing: .04em;
  text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: background-color .2s, color .2s, border-color .2s;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-deep); }
.btn svg { width: 18px; height: 18px; }

/* ヘッダー */
.site-header .container { display: flex; align-items: center; height: 64px; }

/* 完了メッセージ */
.thanks { position: relative; flex: 1; display: flex; align-items: center; overflow: hidden; padding: 72px 0 96px; }
.thanks::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(40% 50% at 85% 20%, color-mix(in srgb, var(--brand) 22%, transparent), transparent 70%),
    radial-gradient(40% 45% at 100% 70%, var(--mist), transparent 72%),
    radial-gradient(30% 30% at 0% 100%, var(--blush), transparent 70%),
    linear-gradient(180deg, #fff, var(--brand-softer));
  filter: blur(8px);
}
.thanks-inner { display: grid; gap: 24px; justify-items: start; }
.thanks-mark {
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--brand); color: #fff;
  box-shadow: 0 16px 32px -16px color-mix(in srgb, var(--brand) 70%, transparent);
}
.thanks-mark svg { width: 30px; height: 30px; }
.thanks-title { font-size: clamp(26px, 7vw, 48px); line-height: 1.4; font-weight: 700; }
.thanks-actions { margin-top: 8px; }

/* フッター */
.site-footer { padding: 40px 0 32px; background: var(--night); color: rgba(255,255,255,.7); }
.site-footer .wordmark { color: #fff; font-size: clamp(36px, 10vw, 72px); }
.site-footer .wordmark i { color: color-mix(in srgb, var(--brand) 45%, #fff); }
.footer-bottom { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.12); font-size: 12px; }

@media (min-width: 768px) {
  :root { --gutter: 32px; }
  .thanks { padding: 120px 0 140px; }
  .thanks-inner { justify-items: center; text-align: center; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="wordmark" href="./index.html" aria-label="GijiLog トップへ"><b>Giji</b><i>Log</i></a>
  </div>
</header>

<main class="thanks">
  <div class="container thanks-inner">
    <div class="thanks-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 class="thanks-title"><span class="nw">送信</span><span class="nw">ありがとうございました</span></h1>
    <!-- CLIENT: 送信後の案内文（確認メールの有無・今後の流れなど）が決まればここに入る -->
    <p class="thanks-actions">
      <a class="btn btn-primary" href="./index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        トップへ戻る
      </a>
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <a class="wordmark" href="./index.html" aria-label="GijiLog トップへ"><b>Giji</b><i>Log</i></a>
    <div class="footer-bottom">
      <!-- CLIENT: 運営会社名・利用規約・プライバシーポリシーのリンクが入る -->
      <span>&copy; GijiLog</span>
    </div>
  </div>
</footer>

</body>
</html>
